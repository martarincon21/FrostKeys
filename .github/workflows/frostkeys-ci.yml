name: FrostKeys CI

on:
  workflow_dispatch:
  push:
    branches:
      - "port/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - name: Install Android build tools and NDK
        run: sdkmanager --install "build-tools;36.0.0" "ndk;28.0.13004108"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew --no-daemon :aosp-latinime:assembleDebug :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FrostKeys-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            aosp-latinime/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frostkeys-build-reports
          path: "**/build/reports/**"
          if-no-files-found: ignore
          retention-days: 7
